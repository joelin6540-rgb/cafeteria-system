<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <title>
        Login
    </title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

</head>

<body class="bg-dark text-white">

<div class="container d-flex justify-content-center align-items-center vh-100">

    <div
        class="card bg-secondary p-5 shadow-lg"
        style="width: 400px; border-radius: 20px;"
    >

        <h1 class="text-center mb-4">
            ☕ Cafetería
        </h1>

        <form method="POST">

            <div class="mb-3">

                <label>
                    Usuario
                </label>

                <input
                    type="text"
                    name="usuario"
                    class="form-control"
                >

            </div>

            <div class="mb-3">

                <label>
                    Contraseña
                </label>

                <input
                    type="password"
                    name="password"
                    class="form-control"
                >

            </div>

            <button
                type="submit"
                class="btn btn-primary w-100"
            >

                Iniciar Sesión

            </button>

        </form>

    </div>

</div>

</body>
</html>
