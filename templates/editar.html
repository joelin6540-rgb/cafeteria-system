<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <title>
        Editar
    </title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

</head>

<body class="bg-dark text-white">

<div class="container mt-5">

    <div class="card bg-secondary p-5">

        <h1 class="mb-4">

            ✏ Editar {{ tabla }}

        </h1>

        <form method="POST">

            {% for col in columnas_form %}

            <div class="mb-3">

                <label>
                    {{ col }}
                </label>

                <input
                    type="text"
                    name="{{ col }}"
                    class="form-control"
                    value="{{ fila[col] }}"
                >

            </div>

            {% endfor %}

            <button class="btn btn-warning">

                Actualizar

            </button>

            <a
                href="/tabla/{{ tabla }}"
                class="btn btn-secondary"
            >
                Cancelar
            </a>

        </form>

    </div>

</div>

</body>
</html>
